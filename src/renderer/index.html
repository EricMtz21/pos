<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand" id="brand" hidden></div>
        <nav id="nav" class="nav" aria-label="Principal"></nav>
        <div class="sidebar-foot">
          <button id="lock" class="nav-item" type="button" hidden></button>
          <button id="theme-toggle" class="nav-item" type="button"></button>
          <span id="version" class="version"></span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1 id="view-title"></h1>
          <p id="view-subtitle"></p>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
